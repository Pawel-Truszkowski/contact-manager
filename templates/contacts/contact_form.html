{% extends "base.html" %}

{% block title %}Edytuj kontakt{% endblock %}

{% block content %}
    <h1 class="mb-4">Edytuj kontakt</h1>

    <form method="post" class="col-md-6">
        {% csrf_token %}
        {% for field in form %}
            <div class="mb-3">
                <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <div class="text-danger small">{{ field.errors }}</div>
                {% endif %}
            </div>
        {% endfor %}

        <button type="submit" class="btn btn-primary">Zapisz</button>
        <a href="{% url 'contact_list' %}" class="btn btn-secondary">Anuluj</a>
    </form>
{% endblock %}
