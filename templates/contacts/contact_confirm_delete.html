{% extends "base.html" %}

{% block title %}Usuń kontakt{% endblock %}

{% block content %}
    <h1 class="mb-4">Usuń kontakt</h1>

    <p>Czy na pewno chcesz usunąć kontakt <strong>{{ contact.first_name }} {{ contact.last_name }}</strong>?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Usuń</button>
        <a href="{% url 'contact_list' %}" class="btn btn-secondary">Anuluj</a>
    </form>
{% endblock %}
